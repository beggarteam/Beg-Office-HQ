<style>
  :root {

  .eyebrow {

  /* ---- arcade-cabinet frame around the office ---- */
  .cabinet {
    position: relative;
    width: 100%;

  .cabinet::before,

  .screw {
    content: "";

  .cabinet::before { top: 12px; left: 12px; }

  .screw.bl { bottom: 12px; left: 12px; }

  /* ---- the office floor: a responsive grid, one tile per beggar ---- */
  .office {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
    gap: clamp(8px, 1.4vw, 14px);

  /* each desk is its own hotspot; position:relative so its tooltip card
     can anchor to it without being clipped by anything else on the page */
  .spot {
    position: relative;
    border: none;
    background: transparent;
    padding: 0;
    cursor: pointer;
    aspect-ratio: 46 / 62;
    border-radius: 8px;
  }

  .spot:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  /* the clipped, visual-only layer: 3 stacked canvases + CRT overlay */
  .tile-clip {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
    box-shadow: inset 0 0 0 2px #0a1e1c, inset 0 0 16px rgba(0,0,0,0.5);
  }

  .tile-clip canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* layer order, idle: bg(0) < head(1) < fg(2) -- fg's monitor rectangle
     hides the lower half of the head, leaving only ears peeking above it */
  .layer-bg   { z-index: 0; }
  .layer-head {
    z-index: 1;
    transform: translateY(0);

  .layer-fg   { z-index: 2; }

  /* active, clicked: head jumps above fg and pops up with a bouncy ease.
     translateY only -- CSS scale() here distorts the sparse canvas content
     around the wrong anchor point, so "bigger" comes from the art itself. */
  .spot.active .layer-head {
    z-index: 3;
    transform: translateY(-15%);
    transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1), z-index 0s;

  .tile-scanlines {

  .tile-vignette {

  /* ---- tooltip card ---- */
  .card {

  .spot.flip-start .card { left: 0; transform: translate(0, 6px); }

  .spot.flip-end .card { left: auto; right: 0; transform: translate(0, 6px); }
  .spot.flip-end.show .card { transform: translate(0, 0); }

  .spot:hover .card,

  .spot.flip-end:hover .card, .spot.flip-end:focus-visible .card, .spot.flip-end.active .card { transform: translate(0, 0); }

  .card::after {

  .card-top {

  .wallet-copy {

  .hint {

  /* ---- ticker ---- */
  .ticker {

</style>

<script>
  // ---- the only part you should ever need to edit ----
  // one X profile URL per beggar. add, remove, or reorder freely.
  const PROFILES = [
    "https://x.com/aloo2evil",
    "https://x.com/Alex0757",
    "https://x.com/chloecadence",
  ];

  // optional: give any beggar a Solana wallet by their X handle (no @).
  // leave it out and their card just shows "wallet coming soon".
  const WALLETS = {
    // Alex0757: "Es7myoFDbRtzeWpb57M1HskkYg3RtuNcegBZAHKp6Ray",
  };
  // ------------------------------------------------------

  const PALETTE = [
    { base: "#e8934a", shade: "#c97230", ear: "#f7c4b2", led: "#56e2ec" },
    { base: "#2a2a30", shade: "#3e3e46", ear: "#785a60", led: "#ec5cd2" },
    { base: "#f5efe0", shade: "#d6cdb6", ear: "#ecb4b0", led: "#ffbe5a" },
    { base: "#8c97a8", shade: "#6e7a8c", ear: "#d2c2c2", led: "#78ec8c" },
    { base: "#f4ecda", shade: "#db8c3f", ear: "#e8b0a8", led: "#b08cff", patch2: "#483a2e" },
    { base: "#23232a", shade: "#373740", ear: "#6e5a5a", led: "#ff7878", patch2: "#ebe6d7" },
    { base: "#5e3f2d", shade: "#462e20", ear: "#c89678", led: "#ffd65a" },
    { base: "#b09ea8", shade: "#92808c", ear: "#e1c8cd", led: "#8cffbe" },
    { base: "#f7c48c", shade: "#d6a066", ear: "#ffdec8", led: "#ffff8c" },
    { base: "#b0b6bc", shade: "#8c929a", ear: "#dccdcd", led: "#ff8cdc" },
  ];

  const BEG_LINES = [
    "spare a like for", "send good vibes to", "tip the jar for",
    "follow if you can for", "boost the post from", "throw a retweet at",
  ];

  function parseHandle(url) {
    try {
      const u = new URL(url);
      const parts = u.pathname.split("/").filter(Boolean);
      if (parts[0]) return "@" + parts[0];
    } catch (e) { /* fall through */ }
    const m = String(url).match(/[A-Za-z0-9_]+$/);
    return m ? "@" + m[0] : "@unknown";
  }

  function truncateWallet(addr) {
    if (addr.length <= 11) return addr;
    return addr.slice(0, 4) + "…" + addr.slice(-4);
  }

  const W = 46, H = 62, cx = 23;
  const WALL_SPLIT = 22, FLOOR_A = "#96683f", FLOOR_B = "#8a5e38", FLOOR_LINE = "#6e4a2a";
  const MON_TOP = 22, MON_BOTTOM = 34, STAND_BOTTOM = 36, SURFACE_END = 41, FRONT_END = 48;
  const DESK_HALF_W = 14, HEAD_CY = 22;

  function ell(ctx, x0, y0, x1, y1, fill) {
    ctx.fillStyle = fill;
    const rx = (x1 - x0) / 2, ry = (y1 - y0) / 2;
    ctx.beginPath();
    ctx.ellipse(x0 + rx, y0 + ry, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  function tri(ctx, x0, y0, x1, y1, x2, y2, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.closePath(); ctx.fill();
  }

  // ---- layer 1: wall + floor (always static, bottom layer) ----
  function drawBackground(ctx) {
    ctx.clearRect(0, 0, W, H);
    const wallTop = [108, 150, 148], wallBottom = [94, 133, 132];
    for (let y = 0; y < WALL_SPLIT; y++) {
      const t = y / WALL_SPLIT;
      const c = wallTop.map((v, i) => Math.round(v + (wallBottom[i] - v) * t));
      ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
      ctx.fillRect(0, y, W, 1);
    }
    ctx.fillStyle = "#3a2e28";
    ctx.fillRect(0, WALL_SPLIT, W, 2);
    for (let y = WALL_SPLIT + 2; y < H; y++) {
      ctx.fillStyle = (Math.floor(y / 3) % 2 === 0) ? FLOOR_A : FLOOR_B;
      ctx.fillRect(0, y, W, 1);
    }
    ctx.fillStyle = FLOOR_LINE;
    for (let x = 4; x < W; x += 16) ctx.fillRect(x, WALL_SPLIT + 2, 1, H - WALL_SPLIT - 2);
  }

  // ---- layer 2: ears + head + big eyes (idle: hidden below fg's monitor;
  //      active: raised above it via CSS transform + z-index) ----
  function drawHead(ctx, colors) {
    ctx.clearRect(0, 0, W, H);
    const { base, shade, ear, patch2 } = colors;

    tri(ctx, cx - 8, HEAD_CY - 4, cx - 4, HEAD_CY - 12, cx - 1, HEAD_CY - 4, base);
    tri(ctx, cx - 6, HEAD_CY - 5, cx - 4, HEAD_CY - 10, cx - 2, HEAD_CY - 5, ear);
    tri(ctx, cx + 8, HEAD_CY - 4, cx + 4, HEAD_CY - 12, cx + 1, HEAD_CY - 4, base);
    tri(ctx, cx + 6, HEAD_CY - 5, cx + 4, HEAD_CY - 10, cx + 2, HEAD_CY - 5, ear);
    ell(ctx, cx - 8, HEAD_CY - 8, cx + 8, HEAD_CY + 10, base);
    if (patch2) {
      ell(ctx, cx - 7, HEAD_CY - 6, cx - 1, HEAD_CY + 2, patch2);
      ell(ctx, cx + 1, HEAD_CY - 2, cx + 7, HEAD_CY + 6, shade);
    } else {
      ell(ctx, cx - 8, HEAD_CY + 2, cx + 8, HEAD_CY + 10, shade);
    }

    // big cute eyes -- only meaningfully visible once the head is raised
    const eyeY = HEAD_CY + 2.5;
    ell(ctx, cx - 7.6, eyeY - 3.4, cx - 0.8, eyeY + 3.4, "#fff");
    ell(ctx, cx + 0.8, eyeY - 3.4, cx + 7.6, eyeY + 3.4, "#fff");
    ell(ctx, cx - 6.2, eyeY - 2.2, cx - 2.2, eyeY + 2.4, "#241c18");
    ell(ctx, cx + 2.2, eyeY - 2.2, cx + 6.2, eyeY + 2.4, "#241c18");
    ell(ctx, cx - 5.3, eyeY - 1.8, cx - 3.5, eyeY - 0.1, "#fff");
    ell(ctx, cx + 3.5, eyeY - 1.8, cx + 5.3, eyeY - 0.1, "#fff");
    // little blush
    ell(ctx, cx - 9, eyeY + 3, cx - 5.5, eyeY + 5.4, "rgba(255,140,140,0.45)");
    ell(ctx, cx + 5.5, eyeY + 3, cx + 9, eyeY + 5.4, "rgba(255,140,140,0.45)");
  }

  // ---- layer 3: monitor + desk + keyboard + paws + tail (occludes the
  //      head's lower half in idle state) ----
  function drawForeground(ctx, colors, tailSide) {
    ctx.clearRect(0, 0, W, H);
    const { base, led } = colors;

    const mx0 = cx - 7, mx1 = cx + 7;
    ctx.fillStyle = "#343438";
    ctx.fillRect(mx0, MON_TOP, mx1 - mx0, MON_BOTTOM - MON_TOP);
    ctx.strokeStyle = "#46464e";
    ctx.strokeRect(mx0 + 0.5, MON_TOP + 0.5, mx1 - mx0 - 1, MON_BOTTOM - MON_TOP - 1);
    for (let lx = mx0 + 2; lx < mx1 - 1; lx += 3) {
      ctx.fillStyle = "#46464e";
      ctx.fillRect(lx, MON_TOP + 2, 1, MON_BOTTOM - MON_TOP - 4);
    }
    ell(ctx, mx1 - 3, MON_BOTTOM - 3, mx1 - 1, MON_BOTTOM - 1, led);
    ctx.fillStyle = "#3c3c42";
    ctx.fillRect(cx - 1, MON_BOTTOM, 2, STAND_BOTTOM - MON_BOTTOM);
    ctx.fillRect(cx - 3, STAND_BOTTOM - 1, 6, 1);

    const side = tailSide;
    const bx = cx + side * (DESK_HALF_W + 1), by = FRONT_END - 2;
    const curl = [
      [bx, by, 2.6], [bx + side * 4, by - 3, 2.2],
      [bx + side * 5, by - 8, 1.8], [bx + side * 2, by - 11, 1.3],
    ];
    curl.forEach(([px, py, r]) => ell(ctx, px - r, py - r, px + r, py + r, base));

    ctx.fillStyle = "#bc845a";
    ctx.fillRect(cx - DESK_HALF_W, STAND_BOTTOM, DESK_HALF_W * 2, 2);
    ctx.fillStyle = "#a8703e";
    ctx.fillRect(cx - DESK_HALF_W, STAND_BOTTOM + 2, DESK_HALF_W * 2, SURFACE_END - STAND_BOTTOM - 2);
    ctx.fillStyle = "#784e2e";
    ctx.fillRect(cx - DESK_HALF_W, SURFACE_END, DESK_HALF_W * 2, FRONT_END - SURFACE_END);
    ctx.fillStyle = "#5a3a22";
    ctx.fillRect(cx - DESK_HALF_W, SURFACE_END, DESK_HALF_W * 2, 1);

    ctx.fillStyle = "#c4c4c8";
    ctx.fillRect(cx - 6, STAND_BOTTOM - 3, 12, 3);
    ctx.fillStyle = "#969ba0";
    ctx.fillRect(cx - 5, STAND_BOTTOM - 2, 10, 1);

    ell(ctx, cx - 7, STAND_BOTTOM - 4, cx - 2, STAND_BOTTOM, base);
    ell(ctx, cx + 2, STAND_BOTTOM - 4, cx + 7, STAND_BOTTOM, base);
  }

  function makeLayerCanvas(cls) {
    const c = document.createElement("canvas");
    c.className = "layer-" + cls;
    c.width = W; c.height = H;
    return c;
  }

  function buildDesk(url, index) {
    const handle = parseHandle(url);
    const colors = PALETTE[index % PALETTE.length];
    const walletAddr = WALLETS[handle.replace("@", "")] || null;

    const btn = document.createElement("button");
    btn.className = "spot";
    btn.style.setProperty("--dot-color", colors.led);
    btn.setAttribute("aria-label", handle + " on X");

    const clip = document.createElement("div");
    clip.className = "tile-clip";

    const bgCanvas = makeLayerCanvas("bg");
    drawBackground(bgCanvas.getContext("2d"));
    clip.appendChild(bgCanvas);

    const headCanvas = makeLayerCanvas("head");
    drawHead(headCanvas.getContext("2d"), colors);
    clip.appendChild(headCanvas);

    const fgCanvas = makeLayerCanvas("fg");
    drawForeground(fgCanvas.getContext("2d"), colors, index % 2 === 0 ? 1 : -1);
    clip.appendChild(fgCanvas);

    const scan = document.createElement("div");
    scan.className = "tile-scanlines";
    clip.appendChild(scan);
    const vig = document.createElement("div");
    vig.className = "tile-vignette";
    clip.appendChild(vig);
    btn.appendChild(clip);

    const glow = document.createElement("div");
    glow.className = "glow";
    btn.appendChild(glow);

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-top">
        <span class="card-dot"></span>
        <span class="card-handle-big">${handle}</span>
      </div>
      <div class="card-row">
        <a class="card-link" href="${url}" target="_blank" rel="noopener noreferrer">View X profile &#8599;</a>
        <button type="button" class="wallet-toggle">Wallet</button>
      </div>
      <div class="wallet-panel">
        ${walletAddr
          ? `<span class="wallet-addr">${truncateWallet(walletAddr)}</span><button type="button" class="wallet-copy">Copy</button>`
          : `<span class="wallet-empty">wallet coming soon</span>`}
      </div>
    `;
    card.querySelector(".card-link").addEventListener("click", (e) => e.stopPropagation());

    const walletToggle = card.querySelector(".wallet-toggle");
    walletToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      card.classList.toggle("wallet-open");
    });

    const copyBtn = card.querySelector(".wallet-copy");
    if (copyBtn) {
      copyBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const done = () => {
          copyBtn.textContent = "Copied!";
          setTimeout(() => { copyBtn.textContent = "Copy"; }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(walletAddr).then(done).catch(() => fallbackCopy(walletAddr, done));
        } else {
          fallbackCopy(walletAddr, done);
        }
      });
    }

    function fallbackCopy(text, cb) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); cb(); } catch (err) { /* ignore */ }
      document.body.removeChild(ta);
    }

    btn.appendChild(card);

    btn.addEventListener("click", () => {
      const wasActive = btn.classList.contains("active");
      document.querySelectorAll(".spot.active").forEach((s) => {
        s.classList.remove("active");
        const c = s.querySelector(".card");
        if (c) c.classList.remove("wallet-open");
      });
      if (!wasActive) btn.classList.add("active");
    });

    function positionCard() {
      btn.classList.remove("flip-start", "flip-end");
      const r = card.getBoundingClientRect();
      if (r.left < 8) btn.classList.add("flip-start");
      else if (r.right > window.innerWidth - 8) btn.classList.add("flip-end");
    }
    btn.addEventListener("mouseenter", () => { btn.classList.add("show"); positionCard(); });
    btn.addEventListener("mouseleave", () => btn.classList.remove("show"));
    btn.addEventListener("focus", () => { btn.classList.add("show"); positionCard(); });
    btn.addEventListener("blur", () => btn.classList.remove("show"));

    return { btn, handle, colors };
  }

  const office = document.getElementById("office");
  const built = PROFILES.map((url, i) => buildDesk(url, i));
  built.forEach(({ btn }) => office.appendChild(btn));

  document.getElementById("eyebrow-text").textContent =
    PROFILES.length + " BEGGAR" + (PROFILES.length === 1 ? "" : "S") + " ON PAYROLL · STATUS: BEGGING HARD";

  const track = document.getElementById("ticker-track");
  const items = built.map(({ handle, colors }, i) => `
    <div class="ticker-item">
      <span class="card-dot" style="background:${colors.led}; box-shadow:0 0 6px ${colors.led}"></span>
      ${BEG_LINES[i % BEG_LINES.length]} <b>${handle}</b>
    </div>
  `).join("");
  track.innerHTML = items + items; // duplicate for a seamless loop

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".spot")) {
      document.querySelectorAll(".spot.active").forEach((s) => {
        s.classList.remove("active");
        const c = s.querySelector(".card");
        if (c) c.classList.remove("wallet-open");
      });
    }
  });
</script>
