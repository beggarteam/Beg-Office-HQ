<style>
  :root {
    --bg: #12302d;
    --bg-deep: #0c2320;
    --bezel: #1d403b;
    --bezel-hi: #2a534c;
    --ink: #f4eedd;
    --ink-dim: #a9c9c1;
    --accent: #ff9a63;
    --accent-2: #7fe3d4;
    --card: #163732;
    --card-border: #37655d;
    --good: #8fe3a0;
    --font-display: "Press Start 2P", "Courier New", monospace;
    --font-body: "Jost", "Trebuchet MS", sans-serif;
    --font-mono: "Space Mono", "Courier New", monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(127, 227, 212, 0.10), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(20px, 5vw, 56px) 16px 40px;
  }

  .wrap { width: 100%; max-width: 820px; }

  nav.crumbs {
    display: flex;
    gap: 18px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 32px;
  }
  nav.crumbs a { color: var(--accent-2); text-decoration: none; }
  nav.crumbs a:hover { text-decoration: underline; }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(20px, 4vw, 30px);
    color: var(--accent);
    margin: 0 0 8px;
  }
  .subtitle {
    font-family: var(--font-mono);
    color: var(--ink-dim);
    font-size: 14px;
    margin: 0 0 36px;
  }

  #cycle-list { display: grid; gap: 16px; }

  .cycle-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 20px 22px;
  }

  .cycle-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .cycle-ticker {
    font-family: var(--font-display);
    font-size: 15px;
    color: var(--accent);
  }
  .cycle-date {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-dim);
  }
  .cycle-ca {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-dim);
    word-break: break-all;
    margin: 0 0 16px;
  }

  .cycle-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
    margin-bottom: 14px;
  }
  .stat .label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .stat .value {
    font-family: var(--font-mono);
    font-size: 17px;
    color: var(--ink);
  }
  .stat .value.burn { color: var(--accent); }
  .stat .value.dist { color: var(--accent-2); }

  .cycle-links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .cycle-links a {
    color: var(--accent-2);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .cycle-links a:hover { border-bottom-color: var(--accent-2); }
  .cycle-links .pending { color: var(--ink-dim); font-style: italic; }

  .whales-line {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--card-border);
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-dim);
  }
  .whales-line b { color: var(--ink); }

  .empty {
    background: var(--card);
    border: 1px dashed var(--card-border);
    border-radius: 12px;
    padding: 32px;
    text-align: center;
    color: var(--ink-dim);
    font-family: var(--font-mono);
    font-size: 14px;
  }

  footer {
    margin-top: 44px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-dim);
    text-align: center;
  }
</style>

<div class="wrap">
  <nav class="crumbs">
    <a href="index.html">Beg Office HQ</a>
    <span>/</span>
    <span>Cycle Log</span>
    <a href="proof-of-begging.html" style="margin-left: auto;">Proof of Begging</a>
  </nav>

  <h1>CYCLE LOG</h1>
  <p class="subtitle">every completed Proof of Begging cycle, permanently on record</p>

  <div id="cycle-list"></div>

  <footer>BEG OFFICE HQ · $BEG</footer>
</div>

<script>
  function truncate(addr) {
    if (!addr || addr.length <= 11) return addr || "";
    return addr.slice(0, 4) + "…" + addr.slice(-4);
  }
  function fmtSol(n) {
    return (typeof n === "number" ? n : 0).toLocaleString(undefined, { maximumFractionDigits: 3 }) + " SOL";
  }
  function fmtDate(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }
  function solscanTx(sig) {
    return "https://solscan.io/tx/" + sig;
  }
  function solscanAddr(addr) {
    return "https://solscan.io/account/" + addr;
  }

  function renderCard(cycle) {
    const el = document.createElement("div");
    el.className = "cycle-card";

    const buyLink = cycle.buyTxSignature
      ? `<a href="${solscanTx(cycle.buyTxSignature)}" target="_blank" rel="noopener">view buy tx ↗</a>`
      : "";
    const burnLinks = cycle.burnTxSignature
      ? `<a href="${solscanTx(cycle.burnTxSignature)}" target="_blank" rel="noopener">view burn tx ↗</a>`
      : `<span class="pending">burn tx pending</span>`;

    const distLinks = (cycle.distribution || [])
      .filter((d) => d.ok)
      .map((d) => `<a href="${solscanTx(d.signature)}" target="_blank" rel="noopener">@${d.handle} ↗</a>`)
      .join("");

    const whales = (cycle.topWhales || []).slice(0, 3);
    const whalesLine = whales.length
      ? `<div class="whales-line">Top whale${whales.length > 1 ? "s" : ""}: ` +
        whales.map((w) => `<b>${truncate(w.address)}</b> (${fmtSol(w.totalSol)})`).join(", ") +
        `</div>`
      : "";

    el.innerHTML = `
      <div class="cycle-head">
        <span class="cycle-ticker">${cycle.ticker || "UNKNOWN"}</span>
        <span class="cycle-date">${fmtDate(cycle.endedAt)}</span>
      </div>
      <p class="cycle-ca">CA: ${cycle.ca || "n/a"}</p>
      <div class="cycle-stats">
        <div class="stat">
          <div class="label">Treasury at end</div>
          <div class="value">${fmtSol(cycle.treasuryAtEndSol)}</div>
        </div>
        <div class="stat">
          <div class="label">Burned (67%)</div>
          <div class="value burn">${fmtSol(cycle.burnAmountSol)}</div>
        </div>
        <div class="stat">
          <div class="label">Distributed (33%)</div>
          <div class="value dist">${fmtSol(cycle.distributedAmountSol)}</div>
        </div>
        <div class="stat">
          <div class="label">Per beggar</div>
          <div class="value">${fmtSol(cycle.perBeggarSol)}</div>
        </div>
      </div>
      <div class="cycle-links">${buyLink}${burnLinks}${distLinks}</div>
      ${whalesLine}
    `;
    return el;
  }

  async function load() {
    const list = document.getElementById("cycle-list");
    try {
      const res = await fetch("./data/cycles.json", { cache: "no-store" });
      const cycles = await res.json();
      if (!Array.isArray(cycles) || cycles.length === 0) {
        list.innerHTML = `<div class="empty">No cycles recorded yet. The first one is either running now or hasn't started.</div>`;
        return;
      }
      cycles
        .slice()
        .reverse()
        .forEach((cycle) => list.appendChild(renderCard(cycle)));
    } catch (e) {
      list.innerHTML = `<div class="empty">Couldn't load the cycle log right now. Try again shortly.</div>`;
    }
  }

  load();
</script>
